version: '3.8'

services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: '3001'
      COVID_DATA_CACHE_FILE: /app/data/owid-statistics.json
      COVID_HISTORY_CACHE_FILE: /app/data/owid-history.json.gz
      COVID_SYNC_INTERVAL_MINUTES: '60'
      COVID_SYNC_RETRY_MINUTES: '5'
      CLIENT_ORIGIN: http://localhost:8080
    volumes:
      - statistics_data:/app/data
    expose:
      - '3001'
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://127.0.0.1:3001/api/v1/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    restart: unless-stopped

  web:
    build:
      context: ./client
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-8080}:80'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  statistics_data:
